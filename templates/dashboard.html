<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Datos - ITM</title>
</head>
<body style="font-family: Arial; padding: 20px;">
    <h2>Actualizar Mis Datos</h2>
    <!-- Aquí le decimos que envíe los datos a tu ruta correcta -->
    <form action="/update_profile" method="POST">
        <label>Tipo de Documento:</label><br>
        <input type="text" name="doc_type" required><br><br>

        <label>Número de Documento:</label><br>
        <input type="text" name="doc_number" required><br><br>

        <label>Dirección:</label><br>
        <input type="text" name="address" required><br><br>

        <label>Teléfono:</label><br>
        <input type="text" name="phone" required><br><br>

        <button type="submit" style="background-color: #0056b3; color: white; padding: 10px; border: none; cursor: pointer;">Guardar Datos</button>
    </form>
    <br>
    <a href="/">Cancelar y volver al inicio</a>
</body>
</html>
